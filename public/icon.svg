<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Vibrant Tight Ambient Glow (Optimized for Taskbar Optical Scale) -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.73  0 0 0 0 0.51  0 0 0 0.45 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Centered Depth Shadow for Glyphs -->
    <filter id="artisticShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#022116" flood-opacity="0.45" />
    </filter>

    <!-- Star Sparkle Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Multi-Chromatic Aurora Gradient (Top to Bottom Depth) -->
    <linearGradient id="auroraGrad" x1="128" y1="7" x2="128" y2="249" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="24%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="84%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Upper Dome Glassmorphic Reflection Highlight -->
    <linearGradient id="topHighlight" x1="128" y1="9" x2="128" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Rim Light (Illuminated Crest and Base) -->
    <linearGradient id="rimLight" x1="128" y1="7" x2="128" y2="249" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Deep Ink Glyph Gradient -->
    <linearGradient id="inkGrad" x1="128" y1="55" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041f16" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Badge (Full-Bleed Optical Size) -->
  <path
    d="M119 10 C124 7 132 7 137 10 L228 63 C234 67 237 72 237 78 L237 178 C237 184 234 189 228 193 L137 246 C132 249 124 249 119 246 L28 193 C22 189 19 184 19 178 L19 78 C19 72 22 67 28 63 Z"
    fill="#10b981"
    opacity="0.35"
    filter="url(#ambientGlow)"
  />

  <!-- Main Symmetrical Shield / Hexagon (Full Optical Presence) -->
  <path
    d="M119 10 C124 7 132 7 137 10 L228 63 C234 67 237 72 237 78 L237 178 C237 184 234 189 228 193 L137 246 C132 249 124 249 119 246 L28 193 C22 189 19 184 19 178 L19 78 C19 72 22 67 28 63 Z"
    fill="url(#auroraGrad)"
    stroke="url(#rimLight)"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Glassmorphic Dome Light Wave Highlight -->
  <path
    d="M119 12 C124 9 132 9 137 12 L226 64 C232 68 234 72 234 78 L234 111 C185 140 71 140 22 111 L22 78 C22 72 24 68 30 64 Z"
    fill="url(#topHighlight)"
  />

  <!-- Concentric Vinyl / Media Groove Rings (Centered at 128, 128) -->
  <circle
    cx="128"
    cy="128"
    r="97"
    stroke="rgba(255, 255, 255, 0.18)"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-dasharray="16 12 32 12"
  />
  <circle
    cx="128"
    cy="128"
    r="78"
    stroke="rgba(255, 255, 255, 0.12)"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-dasharray="8 8"
  />

  <!-- Central Bold MediaGrab Arrow & Cradle (Sculpted with Maximum Legibility) -->
  <g filter="url(#artisticShadow)">
    <!-- Central Vertical Stem -->
    <path
      d="M128 55 L128 147"
      stroke="url(#inkGrad)"
      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Sculpted Flowing Arrowhead -->
    <path
      d="M83 116 C97 135 114 152 128 161 C142 152 159 135 173 116"
      fill="none"
      stroke="url(#inkGrad)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sculpted Cradle Tray (Smiling curve) -->
    <path
      d="M69 192 C100 204 156 204 187 192"
      fill="none"
      stroke="url(#inkGrad)"
      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Subtle Inner Play Accent Dot -->
    <circle cx="128" cy="92" r="5" fill="#58ffd0" opacity="0.95" />
  </g>

  <!-- Signature Craft Starburst Accent (Upper-Right Shoulder) -->
  <g filter="url(#sparkleGlow)" transform="translate(206, 50)">
    <path
      d="M0 -16 C0 -5 5 0 16 0 C5 0 0 5 0 16 C0 5 -5 0 -16 0 C-5 0 0 -5 0 -16 Z"
      fill="#ffffff"
      opacity="0.98"
    />
    <circle cx="0" cy="0" r="2.6" fill="#a7f3d0" />
  </g>
</svg>
