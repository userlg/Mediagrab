<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Soft Organic Ambient Glow -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.73  0 0 0 0 0.51  0 0 0 0.45 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Symmetrical Centered Drop Shadow for the sculpted glyph -->
    <filter id="artisticShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022116" flood-opacity="0.38" />
    </filter>

    <!-- Star Sparkle Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Multi-Chromatic Aurora Gradient (Symmetrical Vertical Projection) -->
    <linearGradient id="auroraGrad" x1="128" y1="24" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="26%" stop-color="#34d399" />
      <stop offset="62%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Upper Dome Glassmorphic Reflection Highlight -->
    <linearGradient id="topHighlight" x1="128" y1="28" x2="128" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Rim Light (Symmetrical Top-to-Bottom) -->
    <linearGradient id="rimLight" x1="128" y1="24" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45" />
    </linearGradient>

    <!-- Deep Ink Glyph Gradient -->
    <linearGradient id="inkGrad" x1="128" y1="64" x2="128" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041f16" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind the Symmetrical Badge -->
  <path
    d="M120 28 C125 25 131 25 136 28 L213 73 C218 76 220 81 220 86 L220 170 C220 175 218 180 213 183 L136 228 C131 231 125 231 120 228 L43 183 C38 180 36 175 36 170 L36 86 C36 81 38 76 43 73 Z"
    fill="#10b981"
    opacity="0.35"
    filter="url(#ambientGlow)"
  />

  <!-- Main Symmetrical Shield / Hexagon -->
  <path
    d="M120 28 C125 25 131 25 136 28 L213 73 C218 76 220 81 220 86 L220 170 C220 175 218 180 213 183 L136 228 C131 231 125 231 120 228 L43 183 C38 180 36 175 36 170 L36 86 C36 81 38 76 43 73 Z"
    fill="url(#auroraGrad)"
    stroke="url(#rimLight)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Glassmorphic Dome Light Wave Highlight -->
  <path
    d="M120 30 C125 27 131 27 136 30 L211 74 C216 77 218 81 218 86 L218 114 C176 138 80 138 38 114 L38 86 C38 81 40 77 45 74 Z"
    fill="url(#topHighlight)"
  />

  <!-- Concentric Vinyl / Media Groove Rings (Artistic Detail, Perfectly Symmetrical) -->
  <circle
    cx="128"
    cy="128"
    r="82"
    stroke="rgba(255, 255, 255, 0.18)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-dasharray="14 10 28 10"
  />
  <circle
    cx="128"
    cy="128"
    r="66"
    stroke="rgba(255, 255, 255, 0.1)"
    stroke-width="1"
    stroke-linecap="round"
    stroke-dasharray="8 8"
  />

  <!-- Central Sculpted MediaGrab Arrow & Cradle (Symmetrical Geometry with Artistic Curves) -->
  <g filter="url(#artisticShadow)">
    <!-- Central Vertical Stem -->
    <path
      d="M128 66 L128 144"
      stroke="url(#inkGrad)"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- Sculpted Flowing Arrowhead with Harmonious Curves -->
    <path
      d="M90 118 C102 134 116 148 128 156 C140 148 154 134 166 118"
      fill="none"
      stroke="url(#inkGrad)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sculpted Cradle Tray (Symmetrical smiling curve) -->
    <path
      d="M78 182 C104 192 152 192 178 182"
      fill="none"
      stroke="url(#inkGrad)"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- Subtle Inner Play Accent Dot (Centered jewel) -->
    <circle cx="128" cy="98" r="4" fill="#58ffd0" opacity="0.9" />
  </g>

  <!-- Artistic Symmetrical Craft Starbursts (Paired Sparks of Creativity) -->
  <!-- Upper-Right Starburst -->
  <g filter="url(#sparkleGlow)" transform="translate(194, 62)">
    <path
      d="M0 -14 C0 -4.5 4.5 0 14 0 C4.5 0 0 4.5 0 14 C0 4.5 -4.5 0 -14 0 C-4.5 0 0 -4.5 0 -14 Z"
      fill="#ffffff"
      opacity="0.95"
    />
    <circle cx="0" cy="0" r="2.2" fill="#a7f3d0" />
  </g>

  <!-- Upper-Left Starburst (Mirror Counterpart) -->
  <g filter="url(#sparkleGlow)" transform="translate(62, 62)">
    <path
      d="M0 -14 C0 -4.5 4.5 0 14 0 C4.5 0 0 4.5 0 14 C0 4.5 -4.5 0 -14 0 C-4.5 0 0 -4.5 0 -14 Z"
      fill="#ffffff"
      opacity="0.95"
    />
    <circle cx="0" cy="0" r="2.2" fill="#a7f3d0" />
  </g>

  <!-- Lower Subtle Balance Gleams (Symmetrical micro-particles) -->
  <circle cx="62" cy="194" r="1.8" fill="#ffffff" opacity="0.5" />
  <circle cx="194" cy="194" r="1.8" fill="#ffffff" opacity="0.5" />
</svg>