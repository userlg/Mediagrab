<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediagrab</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
      }
      #splash img {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.7;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash"><img src="/icon.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
