[package]
name = "Mediagrab"
version = "0.1.0"
description = "A Tauri App"
authors = ["userlg"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediagrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Empaqueta yt-dlp y ffmpeg DENTRO del .exe (se autoextraen junto a él la
# primera vez que corre) en vez de viajar como archivos sidecar aparte.
# Deshabilitado por defecto: el build normal (el que arma el instalador
# NSIS/MSI) sigue usando sidecars sueltos, sin este peso extra embebido.
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
